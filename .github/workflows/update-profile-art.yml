name: Update profile art

# Refreshes everything on the profile that is driven by live data:
# contribution heatmap, stats card, top-languages bar (info card), git log panel.
# Runs daily, on push to main, and on demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Fetch top languages + latest commits (public repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_languages.py
          python scripts/fetch_commits.py

      - name: Render "Now" card + git log panel
        run: |
          python scripts/make_info_card.py
          python scripts/make_commits_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/*.json contrib-heatmap.svg stats.svg info-card.svg art/commits.svg"
