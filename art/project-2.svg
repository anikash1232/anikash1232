<svg xmlns="http://www.w3.org/2000/svg" width="424" height="240" viewBox="0 0 424 240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><style>.f{opacity:0;animation:f .55s ease-out both}@keyframes f{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}.p{opacity:0;animation:p .45s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}@keyframes p{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){.f,.p{opacity:1!important;transform:none!important;animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><rect width="424" height="240" rx="12" fill="url(#bg)"/><rect x=".5" y=".5" width="423" height="239" rx="12" fill="none" stroke="#30363d"/><text x="24" y="44" font-size="17" font-weight="700" fill="#e6edf3">Syllabus-to-Calendar</text><text x="400" y="44" font-size="12" fill="#22d3ee" text-anchor="end">view &#8594;</text><text x="24" y="70" font-size="12" fill="#f2cc60">selected for production over 40+ projects</text><text x="24" y="102" font-size="13" fill="#c9d1d9">Upload a syllabus, get a structured course</text><text x="24" y="122" font-size="13" fill="#c9d1d9">calendar with .ics export. LLM extraction runs</text><text x="24" y="142" font-size="13" fill="#c9d1d9">on a queue so long documents never time out.</text><rect x="24.0" y="192" width="59.6" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="53.8" y="209" font-size="11" fill="#7d8590" text-anchor="middle">Python</text><rect x="91.6" y="192" width="66.2" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="124.7" y="209" font-size="11" fill="#7d8590" text-anchor="middle">FastAPI</text><rect x="165.8" y="192" width="72.8" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="202.2" y="209" font-size="11" fill="#7